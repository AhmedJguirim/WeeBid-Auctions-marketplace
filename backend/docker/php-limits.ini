; Limits that protect a small server (the app only handles pictures up to 5 MB)
upload_max_filesize = 5M
post_max_size = 6M
max_file_uploads = 2
max_input_vars = 500
max_input_time = 20
max_execution_time = 30
memory_limit = 192M
expose_php = Off
; do not leak errors to visitors
display_errors = Off
log_errors = On
