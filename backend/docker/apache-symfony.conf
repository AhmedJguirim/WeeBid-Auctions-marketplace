ServerName localhost
ServerTokens Prod
ServerSignature Off
TraceEnable Off

# --- limits ---------------------------------------------------------------------------------
Timeout 30
KeepAlive On
KeepAliveTimeout 3
MaxKeepAliveRequests 50
LimitRequestBody 6291456
LimitRequestFields 50
LimitRequestFieldSize 8190
LimitRequestLine 4094

<Directory /var/www/html/public>
    AllowOverride None
    Require all granted
    FallbackResource /index.php
    # let the JWT Authorization header reach PHP
    CGIPassAuth On
    Options -Indexes
</Directory>

# --- uploaded files: static content only ----------------------------------------------------
# Nothing in these folders may ever be executed, whatever its name is, and browsers must not
# sniff them as something else (an .svg or .html upload must not be able to run scripts).
<DirectoryMatch "^/var/www/html/public/(media|user|category)">
    php_admin_flag engine off
    RemoveHandler .php .phtml .php3 .php4 .php5 .php7 .phps .phar
    RemoveType .php .phtml .php3 .php4 .php5 .php7 .phps .phar
    Options -ExecCGI -Indexes
    FallbackResource disabled
    Header always set X-Content-Type-Options "nosniff"
    Header always set Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; sandbox"
    <FilesMatch "(?i)\.(php|phtml|phar|pl|py|cgi|sh|html?|js)$">
        Require all denied
    </FilesMatch>
</DirectoryMatch>
