# Single public entrypoint: React app + reverse proxy to backend and socket server.
server {
    listen 80;
    client_max_body_size 20m;

    root /usr/share/nginx/html;
    index index.html;

    # Symfony / API Platform
    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Uploaded images (articles, categories, users). Only real image files, so the
    # React routes /user/:id and /category/:id keep working.
    location /media/ {
        proxy_pass http://backend;
        proxy_set_header Host $http_host;
    }
    location ~ ^/(user|category)/.+\.(png|jpe?g|gif|webp|svg)$ {
        proxy_pass http://backend;
        proxy_set_header Host $http_host;
    }

    # socket.io (websocket upgrade)
    location /socket.io/ {
        proxy_pass http://socket:8081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_read_timeout 3600s;
    }

    # React SPA
    location / {
        try_files $uri /index.html;
    }
}

upstream backend {
    server backend:80;
}
