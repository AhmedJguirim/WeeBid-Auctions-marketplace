# Single public entrypoint: React app + reverse proxy to backend and socket server.
# It is also the first line of defence: rate limits, body size limits, timeouts.

# --- real client IP -------------------------------------------------------------------
# Behind Caddy / another reverse proxy on the host, the connection comes from a private
# address and the real IP is in X-Forwarded-For. Trust it only from private ranges.
set_real_ip_from 127.0.0.1;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# --- rate limit zones (per client IP) ---------------------------------------------------
limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;   # everything (pages, assets, api)
limit_req_zone $binary_remote_addr zone=api:10m     rate=15r/s;   # /api/*
limit_req_zone $binary_remote_addr zone=login:10m   rate=10r/m;   # password guessing
limit_req_zone $binary_remote_addr zone=register:10m rate=1r/m;   # account creation
limit_req_zone $binary_remote_addr zone=upload:10m  rate=10r/m;   # image uploads
# writes (POST/PUT/PATCH/DELETE) only: reads have an empty key, so they are not counted
map $request_method $write_key {
    default         $binary_remote_addr;
    GET             "";
    HEAD            "";
    OPTIONS         "";
}
limit_req_zone $write_key zone=writes:10m rate=1r/s;

limit_conn_zone $binary_remote_addr zone=perip:10m;

limit_req_status  429;
limit_conn_status 429;

upstream backend {
    server backend:80;
}

server {
    listen 80;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # --- limits applying to the whole site ---------------------------------------------
    client_max_body_size 64k;          # JSON payloads are tiny; uploads get their own limit below
    client_body_timeout   15s;
    client_header_timeout 15s;
    send_timeout          30s;
    keepalive_timeout     30s;
    limit_conn perip 40;
    limit_req  zone=general burst=100 nodelay;

    # --- security headers --------------------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # --- nice answer when a limit is hit -----------------------------------------------
    error_page 429 = @too_many_requests;
    error_page 413 = @too_large;
    location @too_many_requests {
        default_type application/json;
        add_header Retry-After 30 always;
        return 429 '{"message":"Too many requests, please slow down."}';
    }
    location @too_large {
        default_type application/json;
        return 413 '{"message":"The request is too large."}';
    }

    # --- API ---------------------------------------------------------------------------
    # defaults for every proxied location
    # (repeated in each location because nginx does not inherit proxy_set_header from a parent that sets its own)
    location /api/ {
        limit_req zone=api    burst=40 nodelay;
        limit_req zone=writes burst=20 nodelay;
        proxy_pass http://backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # login / token refresh: strict, brute force protection
    location ~ ^/api/(login_check|login|token/refresh)$ {
        limit_req zone=login burst=10 nodelay;
        proxy_pass http://backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # sign up: very strict
    location = /api/register {
        limit_req zone=register burst=5 nodelay;
        proxy_pass http://backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # image uploads: the only place where bodies can be big (5 MB per image + multipart overhead)
    location ~ ^/api/(documents|general_docs)$ {
        client_max_body_size 6m;
        client_body_timeout 30s;
        limit_req zone=upload burst=6 nodelay;
        limit_req zone=writes burst=20 nodelay;
        proxy_pass http://backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # notifications are created by the socket server (it talks to the backend directly),
    # browsers must never write to this endpoint
    location = /api/notifications {
        limit_except GET HEAD OPTIONS { deny all; }
        limit_req zone=api burst=40 nodelay;
        proxy_pass http://backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- uploaded images (articles, categories, users) -----------------------------------
    # Only real image files, so the React routes /user/:id and /category/:id keep working.
    location /media/ {
        proxy_pass http://backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location ~ ^/(user|category)/.+\.(png|jpe?g|gif|webp|svg)$ {
        proxy_pass http://backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    # --- socket.io (websocket upgrade) ---------------------------------------------------
    location /socket.io/ {
        limit_conn perip 40;
        proxy_pass http://socket:8081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 3600s;
    }

    # --- React SPA -----------------------------------------------------------------------
    location / {
        try_files $uri /index.html;
    }
    # hashed build files can be cached for a long time
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }
}
